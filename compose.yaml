# Podroid용 Debian Linux 컨테이너
# NeoOS 웹 서버는 여기서 실행하지 않습니다.
services:
  linux:
    build: ./linux
    container_name: neoos-linux
    expose:
      - "8081"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - neoos-linux-home:/home/neoos
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 128
    restart: unless-stopped

volumes:
  neoos-linux-home:
