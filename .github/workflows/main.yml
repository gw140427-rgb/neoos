name: Windows Cloud PC - AnyDesk

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Download & Install AnyDesk
      run: |
        Invoke-WebRequest -Uri "https://download.anydesk.com/AnyDesk.exe" -OutFile "AnyDesk.exe"
        Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--install `"$env:ProgramFiles (x86)\AnyDesk`" --start-with-win --silent" -Wait

    - name: Setup AnyDesk Password
      run: |
        $anydesk = "$env:ProgramFiles (x86)\AnyDesk\AnyDesk.exe"
        cmd /c "echo joyzonetech | `"$anydesk`" --set-password"

    - name: Log To AnyDesk
      run: |
        $anydesk = "$env:ProgramFiles (x86)\AnyDesk\AnyDesk.exe"
        
        # AnyDesk 서비스가 ID를 생성할 때까지 최대 30초 대기
        $ID = ""
        for ($i = 0; $i -lt 10; $i++) {
            Start-Sleep -Seconds 3
            $ID = cmd /c "`"$anydesk`" --get-id"
            if ($ID -and $ID.Trim() -ne "") { break }
        }

        Write-Host "===================================="
        Write-Host "AnyDesk ID: $ID"
        Write-Host "AnyDesk Password: joyzonetech"
        Write-Host "===================================="

    - name: Keep Alive
      run: |
        $timeout = 21600
        Start-Sleep -Seconds $timeout
