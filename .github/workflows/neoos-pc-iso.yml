name: NeoOS PC ISO

on:
  push:
    paths:
      - "os/**"
      - ".github/workflows/neoos-pc-iso.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NeoOS PC ISO
        run: |
          docker run --privileged --rm \\
            -v "$GITHUB_WORKSPACE:/src" \\
            -w /src \\
            archlinux:latest \\
            bash -lc 'bash os/build.sh'

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: neoos-pc-iso
          path: out/*.iso
          if-no-files-found: error
          retention-days: 14
