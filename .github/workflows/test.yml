name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest test_neoos -v

      - name: Smoke test (boot & commands)
        run: |
          printf 'help\ncalc 2 + 3\nversion\nexit\n' | python3 Neoos.py | grep -q "NeoOS를 종료합니다."
