<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>NeoOS Server</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#10141d;color:#eef2ff}body{max-width:1000px;margin:auto;padding:20px}h1{margin-bottom:4px}.muted{color:#aab4cc}.panel{background:#1b2230;border:1px solid #303b50;border-radius:14px;padding:16px;margin:14px 0}input,button{font:inherit;border-radius:9px;padding:10px;border:1px solid #47536a}input{background:#10141d;color:inherit;width:min(100%,420px);box-sizing:border-box}button{background:#34476a;color:white;cursor:pointer;margin:3px}button:disabled{opacity:.45;cursor:not-allowed}.danger{background:#783c48}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.metric{background:#111824;border-radius:10px;padding:12px;overflow-wrap:anywhere}.metric strong{display:block;font-size:1.1rem;margin-top:6px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.status{white-space:pre-wrap;overflow-wrap:anywhere}.container{border-top:1px solid #303b50;padding:12px 0}.container:first-child{border-top:0}.pill{display:inline-block;border-radius:99px;padding:3px 9px;background:#29394c;font-size:.85rem}
</style></head><body>
<h1>NeoOS Server</h1><p class="muted">시스템 상태와 Docker 컨테이너 관리 · 브라우저 터미널/임의 명령 실행은 제공하지 않습니다.</p>
<section class="panel"><h2>연결</h2><div class="row"><label for="token">API 토큰</label><input id="token" type="password" autocomplete="off" placeholder="NEOOS_SERVER_TOKEN"><button id="connect">연결 / 새로고침</button></div><p class="muted">토큰은 이 페이지의 메모리에만 보관하며 브라우저 저장소에는 기록하지 않습니다. HTTPS 또는 SSH 터널을 통해 접속하세요.</p><div id="message" class="status" role="status">연결되지 않음</div></section>
<section class="panel"><h2>시스템</h2><div id="metrics" class="grid"><div class="muted">연결 후 상태를 표시합니다.</div></div></section>
<section class="panel"><h2>Docker</h2><div id="docker" class="status">연결 후 Docker 상태를 표시합니다.</div><div id="containers"></div></section>
<script>
(() => {
 const $=id=>document.getElementById(id);let token="";
 const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
 const bytes=n=>n==null?"정보 없음":(n/1073741824).toFixed(2)+" GiB";
 async function api(path,options={}){const headers=Object.assign({"Authorization":"Bearer "+token},options.headers||{});if(options.body)headers["Content-Type"]="application/json";const r=await fetch(path,Object.assign({},options,{headers}));const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||d.error||("HTTP "+r.status));return d;}
 function metrics(s){const a=[["플랫폼",s.platform],["아키텍처",s.architecture],["Python",s.python],["가동 시간",Math.floor(s.uptime_seconds/3600)+"시간 "+Math.floor(s.uptime_seconds%3600/60)+"분"],["디스크 전체",bytes(s.disk_root?.total_bytes)],["디스크 여유",bytes(s.disk_root?.free_bytes)],["메모리 전체",bytes(s.memory?.total_bytes)],["메모리 사용 가능",bytes(s.memory?.available_bytes)]];$("metrics").innerHTML=a.map(([k,v])=>'<div class="metric">'+esc(k)+'<strong>'+esc(v)+'</strong></div>').join("");}
 function containers(d){if(!d.available){$("containers").innerHTML='<p class="muted">'+esc(d.reason)+'</p>';return;}if(!d.containers.length){$("containers").innerHTML='<p class="muted">컨테이너가 없습니다.</p>';return;}
 $("containers").innerHTML=d.containers.map(c=>{const running=String(c.state).toLowerCase()==="running",id=esc(c.id);return '<div class="container"><div><strong>'+esc(c.name)+'</strong> <span class="pill">'+esc(c.state)+'</span></div><div class="muted">'+esc(c.image)+' · '+esc(c.status)+' · '+id+'</div><div class="row" style="margin-top:8px"><button data-action="start" data-id="'+id+'" '+(running?'disabled':'')+'>시작</button><button class="danger" data-action="stop" data-id="'+id+'" '+(!running?'disabled':'')+'>중지</button><button data-action="restart" data-id="'+id+'">재시작</button></div></div>';}).join("");
 $("containers").querySelectorAll("button[data-action]").forEach(b=>b.addEventListener("click",async()=>{const action=b.dataset.action,id=b.dataset.id;if(!confirm("컨테이너 "+id+" 에 "+action+" 작업을 실행할까요?"))return;b.disabled=true;try{await api("/api/container-action",{method:"POST",body:JSON.stringify({container_id:id,action,confirm:true})});$("message").textContent="작업 완료: "+action+" · "+id;await refresh();}catch(e){$("message").textContent="작업 실패: "+e.message;b.disabled=false;}}));}
 async function refresh(){try{const [s,d,c]=await Promise.all([api("/api/status"),api("/api/docker"),api("/api/containers")]);metrics(s);$("docker").textContent=d.available?"Docker "+d.server_version+" 사용 가능":"Docker 사용 불가: "+d.reason;containers(c);$("message").textContent="연결됨 · 상태를 불러왔습니다.";}catch(e){$("message").textContent="연결 실패: "+e.message;}}
 $("connect").addEventListener("click",()=>{token=$("token").value.trim();if(!token){$("message").textContent="토큰을 입력하세요.";return;}refresh();});
})();
</script></body></html>
