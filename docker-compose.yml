# dockurr/windows 를 Docker Compose 로 실행하기 위한 파일입니다.
#
# ⚠️ 주의: RDP(3389) 포트는 보안상 127.0.0.1 에만 바인딩하는 것을 권장합니다.
#    외부에 노출해야 한다면 방화벽/VPN 설정을 반드시 확인하세요.

services:
  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "127.0.0.1:3389:3389/tcp"
      - "127.0.0.1:3389:3389/udp"
    volumes:
      - ./windows:/storage
    restart: always
    stop_grace_period: 2m
