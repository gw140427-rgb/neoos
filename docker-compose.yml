# NeoOS 웹 터미널 + (참고용) dockurr/windows 를 함께 관리하는 Compose 파일입니다.
#
# ⚠️ 주의: RDP(3389) 포트는 보안상 127.0.0.1 에만 바인딩하는 것을 권장합니다.
#    외부에 노출해야 한다면 방화벽/VPN 설정을 반드시 확인하세요.

services:
  # NeoOS 웹 터미널 (VPS 모드) - 브라우저에서 접속
  neoos:
    build: .
    container_name: neoos
    environment:
      PORT: "10000"
      NEOOS_DB: /data/database.db
      NEOOS_ADMIN_PASSWORD: ${NEOOS_ADMIN_PASSWORD:-neoos-admin-2026}
      NEOOS_LINUX_API: http://linux:8081/exec
    ports:
      - "10000:10000"
    volumes:
      - neoos-data:/data
    restart: unless-stopped
    networks:
      - neoos-net

  linux:
    build: ./linux
    container_name: neoos-linux
    expose:
      - "8081"
    volumes:
      - neoos-linux-home:/home/neoos
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /run:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: "0.75"
    pids_limit: 128
    restart: unless-stopped
    networks:
      - neoos-net

  windows:
    image: dockurr/windows
    container_name: windows
    environment:
      VERSION: "11"
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - "8006:8006"
      - "127.0.0.1:3389:3389/tcp"
      - "127.0.0.1:3389:3389/udp"
    volumes:
      - ./windows:/storage
    restart: always
    stop_grace_period: 2m

volumes:
  neoos-data:
  neoos-linux-home:

networks:
  neoos-net:
    internal: true
